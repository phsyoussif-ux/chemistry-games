<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة اكتشاف الكيمياء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a1220;
    --bg-panel:#101c30;
    --line: rgba(79,217,232,0.18);
    --cyan:#4fd9e8;
    --cyan-soft:rgba(79,217,232,0.14);
    --amber:#f2b705;
    --amber-soft:rgba(242,183,5,0.14);
    --coral:#ff6b5e;
    --coral-soft:rgba(255,107,94,0.14);
    --green:#6fcf7c;
    --green-soft:rgba(111,207,124,0.14);
    --ink:#eef2f6;
    --ink-dim:#9fb0c3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(79,217,232,0.10), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(242,183,5,0.08), transparent 45%),
      var(--bg-deep);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:22px 14px 40px;
  }
  .app{
    width:100%;
    max-width:720px;
  }
  /* header */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 12px 3px var(--cyan);
    flex-shrink:0;
  }
  .brand span{
    font-family:'Almarai',sans-serif;
    font-weight:800;
    font-size:15px;
    color:var(--ink-dim);
    letter-spacing:0.3px;
  }
  .score-badge{
    font-family:'Almarai',sans-serif;
    font-weight:700;
    font-size:14px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    padding:7px 14px;
    border-radius:999px;
    color:var(--amber);
    white-space:nowrap;
  }
  /* progress tube */
  .tube-wrap{
    height:8px;
    border-radius:999px;
    background:#0c1626;
    border:1px solid var(--line);
    overflow:hidden;
    margin-bottom:26px;
    position:relative;
  }
  .tube-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--cyan), #8ff3ff);
    box-shadow:0 0 14px 2px var(--cyan);
    transition:width .5s ease;
  }
  /* card shell */
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:30px 26px;
    position:relative;
    overflow:hidden;
    box-shadow:0 20px 50px -25px rgba(0,0,0,0.7);
  }
  .panel::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:34px 34px;
    opacity:0.25;
    pointer-events:none;
  }
  .eyebrow{
    font-family:'Almarai',sans-serif;
    font-weight:700;
    font-size:12.5px;
    color:var(--cyan);
    letter-spacing:0.5px;
    display:inline-block;
    background:var(--cyan-soft);
    border:1px solid rgba(79,217,232,0.35);
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:16px;
    position:relative;
  }
  h1{
    font-family:'Almarai',sans-serif;
    font-weight:800;
    font-size:26px;
    line-height:1.4;
    margin:0 0 10px;
    position:relative;
  }
  h2{
    font-family:'Almarai',sans-serif;
    font-weight:800;
    font-size:20px;
    line-height:1.5;
    margin:0 0 14px;
    position:relative;
  }
  p.lead{
    color:var(--ink-dim);
    font-size:15.5px;
    line-height:1.9;
    margin:0 0 22px;
    position:relative;
  }
  .btn{
    font-family:'Almarai',sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:12px;
    padding:14px 22px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    position:relative;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    background:var(--cyan);
    color:#03222a;
    box-shadow:0 8px 22px -8px rgba(79,217,232,0.6);
  }
  .btn-primary:hover{box-shadow:0 10px 26px -6px rgba(79,217,232,0.75);}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
  }
  .btn-ghost:hover{border-color:var(--cyan);}
  .btn-wide{width:100%;}
  .btn-row{
    display:flex;
    gap:10px;
    margin-top:10px;
    position:relative;
    flex-wrap:wrap;
  }
  /* riddle / TF card */
  .qcard{
    background:#0c1626;
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
    position:relative;
  }
  .qtag{
    font-family:'Almarai',sans-serif;
    font-weight:700;
    font-size:12px;
    color:var(--amber);
    margin-bottom:10px;
  }
  .qtext{
    font-size:16.5px;
    line-height:1.85;
    margin-bottom:16px;
  }
  .reveal{
    border-top:1px dashed var(--line);
    padding-top:14px;
    margin-top:4px;
    animation:fadein .35s ease;
  }
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .reveal .ans-title{
    font-family:'Almarai',sans-serif;
    font-weight:800;
    font-size:16px;
    margin-bottom:6px;
  }
  .reveal .ans-title.ok{color:var(--green);}
  .reveal .ans-title.no{color:var(--coral);}
  .reveal .ans-body{
    color:var(--ink-dim);
    font-size:14.5px;
    line-height:1.85;
  }
  .tf-buttons{
    display:flex;
    gap:10px;
  }
  .tf-btn{
    flex:1;
    font-family:'Almarai',sans-serif;
    font-weight:700;
    font-size:14.5px;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .tf-btn.true-btn:hover{border-color:var(--green); color:var(--green);}
  .tf-btn.false-btn:hover{border-color:var(--coral); color:var(--coral);}
  .tf-btn.chosen-ok{background:var(--green-soft); border-color:var(--green); color:var(--green);}
  .tf-btn.chosen-no{background:var(--coral-soft); border-color:var(--coral); color:var(--coral);}
  .tf-btn:disabled{cursor:default; opacity:0.55;}
  .counter{
    font-size:13px;
    color:var(--ink-dim);
    margin-bottom:8px;
  }
  /* unit preview cards */
  .unit-card{
    background:#0c1626;
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:14px;
  }
  .unit-card .u-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .unit-card .u-num{
    font-family:'Almarai',sans-serif;
    font-weight:800;
    font-size:13px;
    color:#03222a;
    background:var(--amber);
    width:28px;height:28px;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .unit-card .u-title{
    font-family:'Almarai',sans-serif;
    font-weight:700;
    font-size:15.5px;
  }
  .unit-card ul{
    margin:0;
    padding-inline-start:20px;
    color:var(--ink-dim);
    font-size:14px;
    line-height:2;
  }
  /* rules list */
  .rule-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:#0c1626;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    opacity:0;
    animation:fadein .4s ease forwards;
  }
  .rule-row .r-ico{
    font-size:18px;
    flex-shrink:0;
  }
  .rule-row .r-text{
    font-size:14.5px;
    line-height:1.8;
    color:var(--ink);
  }
  /* result */
  .result-score{
    font-family:'Almarai',sans-serif;
    font-weight:800;
    font-size:46px;
    color:var(--cyan);
    text-align:center;
    margin:6px 0 2px;
    text-shadow:0 0 22px rgba(79,217,232,0.5);
  }
  .result-sub{
    text-align:center;
    color:var(--ink-dim);
    font-size:14px;
    margin-bottom:22px;
  }
  .footer-note{
    text-align:center;
    color:var(--ink-dim);
    font-size:12.5px;
    margin-top:16px;
  }
  @media (max-width:480px){
    .panel{padding:22px 18px;}
    h1{font-size:22px;}
    .result-score{font-size:38px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="dot"></span><span>الكيمياء · الصف التاسع · الفصل الأول</span></div>
    <div class="score-badge" id="scoreBadge">النقاط: 0</div>
  </div>
  <div class="tube-wrap"><div class="tube-fill" id="tubeFill"></div></div>
  <div class="panel" id="panel"></div>
</div>

<script>
const state = {
  screen: 'intro', // intro, A, B, C, D, result
  aIndex: 0,
  bIndex: 0,
  cIndex: 0,
  dIndex: 0,
  score: 0,
  maxScore: 0
};

const scientists = [
  {
    riddle: "افترضتُ أن الذرّة كرةٌ صلبة صغيرة، لا يمكن تجزئتها ولا رؤيتها بالعين، وأن ذرات العنصر الواحد متشابهة تمامًا في الشكل والكتلة... من أنا؟",
    name: "جون دالتون — نموذج دالتون",
    detail: "أول من وضع تصورًا علميًا منظّمًا للذرّة، ووصفها بأنها جسيم كروي متناهٍ في الصغر لا يمكن تجزئته. كانت هذه أول لبنة في رحلة اكتشاف بنية الذرّة."
  },
  {
    riddle: "استخدمتُ أنبوب التفريغ الكهربائي، فلاحظتُ حزمة أشعة تنجذب نحو القطب الموجب للمغناطيس، فاكتشفتُ جسيمًا سالب الشحنة داخل الذرّة... من أنا؟",
    name: "طومسون — نموذج طومسون",
    detail: "اكتشف الإلكترون باستخدام أنبوب التفريغ الكهربائي، وهدم بذلك فكرة أن الذرّة كرة مصمتة لا تحتوي على أي جسيمات أصغر."
  },
  {
    riddle: "قصفتُ صفيحة رقيقة من الذهب بجسيمات ألفا، فوجدتُ أن معظمها يخترق الصفيحة، بينما ينحرف جزء صغير منها بزوايا كبيرة... فاستنتجتُ وجود نواة صغيرة كثيفة موجبة الشحنة... من أنا؟",
    name: "رذرفورد — النموذج النووي",
    detail: "أثبتت تجربته أن معظم حجم الذرّة فراغ، وأن كتلتها وشحنتها الموجبة تتركّز في نواة صغيرة جدًا في مركزها."
  },
  {
    riddle: "أجريتُ تجارب على تحليل محاليل بعض المركّبات كهربائيًا، فوجدتُ أن هذه المواد تحتوي على جسيمات مشحونة يمكن أن تفقدها أو تكتسبها أثناء تفاعلها... من أنا؟",
    name: "مايكل فاراداي — تجارب التحليل الكهربائي",
    detail: "مهّدت تجاربه في التحليل الكهربائي الطريق لاكتشاف أن المادة تحوي جسيمات مشحونة كهربائيًا، وهو ما بُني عليه لاحقًا اكتشاف الإلكترون."
  }
];

const trueFalse = [
  { stmt:"الذرّة أصغر جزء في المادة، ولا تحتوي على أي جسيمات أصغر منها.", answer:false, why:"الذرّة تتكوّن من جسيمات أدقّ منها: إلكترونات وبروتونات ونيوترونات." },
  { stmt:"معظم حجم الذرّة عبارة عن فراغ.", answer:true, why:"بحسب نموذج رذرفورد، تتركّز كتلة الذرّة وشحنتها الموجبة في نواة صغيرة جدًا، وباقي الذرّة فراغ تدور فيه الإلكترونات." },
  { stmt:"عصير الليمون مادة حمضية.", answer:true, why:"صحيح، وسندرس خصائص المواد الحمضية بالتفصيل في الوحدة الثانية من هذا الفصل." },
  { stmt:"الصابون والمنظفات غالبًا مواد قاعدية.", answer:true, why:"صحيح، وهذا أحد الأمثلة العملية على القواعد التي نستخدمها يوميًا." },
  { stmt:"النيوترونات تحمل شحنة سالبة تمامًا مثل الإلكترونات.", answer:false, why:"النيوترونات متعادلة الشحنة، أما الشحنة السالبة فتحملها الإلكترونات فقط." },
  { stmt:"ترتيب عناصر الجدول الدوري عشوائي وليس له نظام محدد.", answer:false, why:"العناصر مرتّبة في الجدول الدوري وفق أعدادها الذرّية، بحيث تتكرّر خصائصها بصفة دورية." }
];

const units = [
  {
    num:"01",
    title:"بنية الذرّة",
    items:[
      "مكوّنات الذرّة: من نموذج دالتون إلى نموذج رذرفورد",
      "تجربة استهلالية: التفريغ الكهربائي",
      "الجدول الدوري والتوزيع الإلكتروني"
    ]
  },
  {
    num:"02",
    title:"الحموض والقواعد والأملاح",
    items:[
      "الخصائص الحمضية والقاعدية لبعض المواد",
      "تفاعل الحموض والقواعد",
      "أمثلة من حياتنا اليومية"
    ]
  }
];

const rules = [
  { ico:"🥼", text:"أرتدي مِعطف المختبر والنظارات الواقية والقفازات عند إجراء أي تجربة." },
  { ico:"⚠️", text:"أتعامل مع الأجهزة والأدوات الكهربائية بحذر شديد، ولا ألمس ما لا أعرفه." },
  { ico:"📋", text:"أتّبع إرشادات السلامة العامة في المختبر قبل البدء بأي خطوة." },
  { ico:"✍️", text:"أسجّل ملاحظاتي أولًا بأول، وأقارن ما أشاهده بما أتوقّعه." },
  { ico:"🙋", text:"أشارك بسؤالي مهما بدا بسيطًا — أفضل الاكتشافات بدأت بسؤال." }
];

const totalSteps = 1 + scientists.length + trueFalse.length + 1 + 1 + 1; // rough for progress bar
let stepDone = 0;

function updateProgress(){
  const pct = Math.min(100, Math.round((stepDone/totalSteps)*100));
  document.getElementById('tubeFill').style.width = pct + '%';
}
function updateScore(){
  document.getElementById('scoreBadge').textContent = 'النقاط: ' + state.score;
}

function render(){
  const panel = document.getElementById('panel');
  panel.innerHTML = '';
  if(state.screen==='intro') renderIntro(panel);
  else if(state.screen==='A') renderA(panel);
  else if(state.screen==='B') renderB(panel);
  else if(state.screen==='C') renderC(panel);
  else if(state.screen==='D') renderD(panel);
  else if(state.screen==='result') renderResult(panel);
  updateProgress();
  updateScore();
}

function renderIntro(panel){
  panel.innerHTML = `
    <span class="eyebrow">اليوم الأول · الفصل الدراسي الأول</span>
    <h1>أهلًا بكم في رحلة اكتشاف الكيمياء 🧪</h1>
    <p class="lead">قبل أن نفتح الكتاب، عندنا لعبة قصيرة تعرّفكم على مادة الكيمياء اللي رح ندرسها هالفصل: قصص العلماء اللي اكتشفوا مكوّنات الذرّة، شوية حقائق ممتعة، ونظرة سريعة على محتوى الكتاب. جاهزين نبلش؟</p>
    <button class="btn btn-primary btn-wide" onclick="startA()">ابدأ اللعبة</button>
  `;
}

function startA(){ state.screen='A'; state.aIndex=0; render(); }

function renderA(panel){
  const i = state.aIndex;
  const item = scientists[i];
  const revealed = item._revealed;
  panel.innerHTML = `
    <span class="eyebrow">الجولة 1 · من أنا؟</span>
    <h2>تعرّفوا على العلماء اللي اكتشفوا الذرّة</h2>
    <div class="counter">لغز ${i+1} من ${scientists.length}</div>
    <div class="qcard">
      <div class="qtag">لغز علمي</div>
      <div class="qtext">${item.riddle}</div>
      ${revealed ? `
        <div class="reveal">
          <div class="ans-title ok">${item.name}</div>
          <div class="ans-body">${item.detail}</div>
        </div>
      ` : `
        <button class="btn btn-ghost btn-wide" onclick="revealA(${i})">كشف الإجابة</button>
      `}
    </div>
    <div class="btn-row">
      ${revealed ? `<button class="btn btn-primary" onclick="nextA()">${i < scientists.length-1 ? 'اللغز التالي' : 'الجولة التالية'}</button>` : ''}
    </div>
  `;
}
function revealA(i){
  scientists[i]._revealed = true;
  state.score += 1; state.maxScore += 1; stepDone++;
  render();
}
function nextA(){
  if(state.aIndex < scientists.length-1){ state.aIndex++; render(); }
  else { state.screen='B'; state.bIndex=0; render(); }
}

function renderB(panel){
  const i = state.bIndex;
  const item = trueFalse[i];
  const chosen = item._chosen; // true/false/undefined
  panel.innerHTML = `
    <span class="eyebrow">الجولة 2 · صح ولّا غلط؟</span>
    <h2>اختبروا حدسكم الكيميائي</h2>
    <div class="counter">عبارة ${i+1} من ${trueFalse.length}</div>
    <div class="qcard">
      <div class="qtag">عبارة</div>
      <div class="qtext">${item.stmt}</div>
      ${chosen===undefined ? `
        <div class="tf-buttons">
          <button class="tf-btn true-btn" onclick="answerB(${i}, true)">✅ صح</button>
          <button class="tf-btn false-btn" onclick="answerB(${i}, false)">❌ غلط</button>
        </div>
      ` : `
        <div class="reveal">
          <div class="ans-title ${chosen===item.answer ? 'ok':'no'}">${chosen===item.answer ? 'إجابة صحيحة! 🎉' : 'مو تمامًا 🤔'} — الحقيقة: ${item.answer ? 'صح':'غلط'}</div>
          <div class="ans-body">${item.why}</div>
        </div>
      `}
    </div>
    <div class="btn-row">
      ${chosen!==undefined ? `<button class="btn btn-primary" onclick="nextB()">${i < trueFalse.length-1 ? 'العبارة التالية' : 'الجولة التالية'}</button>` : ''}
    </div>
  `;
}
function answerB(i, val){
  trueFalse[i]._chosen = val;
  state.maxScore += 1; stepDone++;
  if(val===trueFalse[i].answer) state.score += 1;
  render();
}
function nextB(){
  if(state.bIndex < trueFalse.length-1){ state.bIndex++; render(); }
  else { state.screen='C'; state.cIndex=0; render(); }
}

function renderC(panel){
  panel.innerHTML = `
    <span class="eyebrow">الجولة 3 · بماذا سنبدأ؟</span>
    <h2>نظرة سريعة على محتوى الفصل</h2>
    <p class="lead">هاي أهم الوحدات اللي رح نتعرف عليها سوا هالفصل:</p>
    ${units.map(u => `
      <div class="unit-card">
        <div class="u-head">
          <div class="u-num">${u.num}</div>
          <div class="u-title">${u.title}</div>
        </div>
        <ul>${u.items.map(x=>`<li>${x}</li>`).join('')}</ul>
      </div>
    `).join('')}
    <button class="btn btn-primary btn-wide" onclick="finish()">إنهاء اللعبة</button>
  `;
  stepDone++;
}

function finish(){ state.screen='result'; stepDone = totalSteps; render(); }

function renderResult(panel){
  const pct = state.maxScore ? Math.round((state.score/state.maxScore)*100) : 0;
  let msg = "بداية ممتازة! خلونا نشوف أول تجربة سوا 🔬";
  if(pct >= 80) msg = "أداء رائع! يبدو إنكم جاهزين لرحلة الكيمياء 🚀";
  else if(pct < 40) msg = "لا بأس، هذا بس البداية — رح نتعلم كل هذا خطوة بخطوة 🙂";
  panel.innerHTML = `
    <span class="eyebrow">النتيجة النهائية</span>
    <h1 style="text-align:center;">أهلًا فيكم رسميًا في مادة الكيمياء</h1>
    <div class="result-score">${state.score} / ${state.maxScore}</div>
    <div class="result-sub">${msg}</div>
    <p class="lead" style="text-align:center;">أول محطة إلنا هي تجربة "التفريغ الكهربائي" — بداية اكتشاف مكوّنات الذرّة. استعدوا! ⚡</p>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-ghost" onclick="restart()">إعادة اللعب</button>
    </div>
    <div class="footer-note">الصف التاسع · الفصل الدراسي الأول · الوحدة الأولى: بنية الذرّة</div>
  `;
}

function restart(){
  scientists.forEach(s=> delete s._revealed);
  trueFalse.forEach(t=> delete t._chosen);
  state.screen='intro'; state.aIndex=0; state.bIndex=0; state.cIndex=0; state.dIndex=0;
  state.score=0; state.maxScore=0; stepDone=0;
  render();
}

render();
</script>
</body>
</html>
