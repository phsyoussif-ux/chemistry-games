[N(5),'الفسفور منها يدخل في صناعة أعواد الثقاب'],
[N(6),'الكبريت منها يدخل في صناعة حمض الكبريتيك'],
[N(7),'الكلور منها يُستخدم في تعقيم المياه'],
[N(8),'الهيليوم منها يُستخدم في تعبئة بالونات الرصد الجوي']],f:'ربطت كل مجموعة بخاصية أو استخدام ورد في الكتاب.'};
const BOSS=[B('2, 8, 3','ويُستخدم في صناعة هياكل الطائرات والأسلاك الكهربائية',3),B('2, 8, 1','ويُحفظ تحت الكاز بمعزل عن الهواء',1),B('2, 8, 8','ويُستخدم في صناعة مصابيح الإضاءة',8),B('2, 8, 7','ويُستخدم في تعقيم المياه وصناعة المنظفات',7),B('2, 4','ويدخل في صناعة أنواع البلاستيك المختلفة',4),B('2, 5','ويدخل مع الفسفور في تركيب الحموض النووية',5),B('2, 8, 6','وهو صلب أصفر اللون يدخل في صناعة حمض الكبريتيك',6),B('2, 8, 2','ويفقد إلكترونين بسهولة مكوّناً أيوناً ثنائياً موجباً [+2]',2)];
const scr=[];
Q.forEach((a,g)=>{a.forEach((q,j)=>scr.push({...q,g,pt:j+1,s:'g'+g}));scr.push({t:'c',g,s:'g'+g})});
WHO.forEach(q=>scr.push({...q,s:'w'}));scr.push({...FM,s:'f'});BOSS.forEach(q=>scr.push({...q,s:'b'}));scr.push({t:'r',s:'b'});
const S={i:-1,last:0,pts:0,ok:0,d:{},tm:0},cd=()=>S.d[S.i],cx=()=>scr[S.i];
const lb=x=>x.g!=null?`⚛️ المجموعة ${x.g+1} من 8`:x.s=='w'?'🕵️ تحدي من أنا؟':x.s=='f'?'🔗 اربط المجموعة بشخصيتها':'🔥 التحدي النهائي';
function R(){
 const x=cx();let h='';
 document.body.style.setProperty('--c',`hsl(${x&&x.g!=null?H[x.g]:175} 75% 58%)`);
 if(S.i<0){
  h=`<div class=card style="text-align:center"><div style="font-size:64px">⚛️</div><h1>شخصية المجموعة</h1><p>اكتشف شخصية كل مجموعة من خصائصها واستخداماتها</p><p><b>رحلتك تبدأ من المجموعة 1 وتنتهي بالمجموعة 8</b></p><button class="pr big" onclick=Go()>▶️ ابدأ الرحلة</button><p style="color:var(--mu)">في كل مرحلة ستتعرف إلى مجموعة، ثم تختبر قدرتك على اكتشاف شخصيتها.</p><button onclick=TMo(1)>👨‍🏫 وضع المعلم</button></div>`;
 }else{
  const d=S.d[S.i]=S.d[S.i]||{},pc=Math.round(S.i/(scr.length-1)*100);
  h=`<div class=top><b>${lb(x)}</b><div class=st><span>⭐ النقاط <b>${S.pts}</b></span><span>🎯 الإجابات الصحيحة <b>${S.ok}</b></span><span>📊 التقدم <b>${pc}%</b></span></div></div><div class=bar><i style="width:${pc}%"></i></div>`;
  const pv=`<button onclick=Gs(-1) ${S.i?'':'disabled'}>→ السابق</button>`,tag=`<span class=tag>${x.pt?'الجزء '+x.pt+' • ':''}${x.m||''}</span>`;
  if(x.t=='c'){const g=G[x.g];
   h+=`<div class=card><h2>🧪 شخصية ${N(x.g+1)}</h2><div class=rw><b>🔢 عدد إلكترونات المستوى الخارجي</b>${g.e}</div><div class=rw><b>🏷️ الاسم / الوصف</b>${g.nm}</div><div class=rw><b>✨ أهم خصائصها</b><ul>${g.pr.map(t=>'<li>'+t+'</li>').join('')}</ul></div><div class=rw><b>🧬 أشهر عناصرها</b>${g.el}</div><div class=rw><b>🏭 الاستخدامات في الكتاب</b><ul>${g.us.split(' • ').map(t=>'<li>'+t+'</li>').join('')}</ul></div><div class=nav>${pv}${d.a?`<button class="pr big" onclick=Nx()>${x.g==7?'انتقل إلى التحديات النهائية →':'انتقل للمجموعة التالية →'}</button>`:'<button class="pr big" onclick=Ka()>فهمت الشخصية ✓</button>'}</div></div>`;
  }else if(x.t=='r'){
   if(!d.b){d.b=1;d.p=30;S.pts+=30}
   const tt=scr.filter(y=>y.q).length;
   h+=`<div class=card style="text-align:center"><div style="font-size:64px">🏆</div><h1>أنهيت الرحلة!</h1><p>أكملت التحدي النهائي (+30 نقطة)</p><div class=st style="justify-content:center"><span>⭐ النقاط <b>${S.pts}</b></span><span>🎯 الإجابات الصحيحة <b>${S.ok}</b> من ${tt}</span></div><p>ربطت بين رقم المجموعة وعدد إلكترونات المستوى الخارجي وخصائصها واستخداماتها.</p><button class="pr big" onclick=RG()>🔁 إعادة اللعبة</button> <button onclick=Hm()>الرئيسية</button></div>`;
  }else if(x.p){
   const n=x.p.length;if(!d.o){d.o=sh([...Array(n).keys()]);d.m=[];d.e=0;d.l=null}
   h+=`<div class=card>${tag}<h2>${x.q}</h2><div class=g2><div>${x.p.map((r,k)=>`<button class="o ${d.m[k]?'g':d.l===k?'s':''}" onclick=ML(${k}) ${d.m[k]?'disabled':''}>${r[0]}</button>`).join('')}</div><div>${d.o.map(k=>`<button class="o ${d.m[k]?'g':''}" onclick=MR(${k}) ${d.m[k]?'disabled':''}>${x.p[k][1]}</button>`).join('')}</div></div>`;
   if(d.msg&&!d.ok)h+=`<div class="fb ${d.msg[0]=='✓'?'g':'b'}">${d.msg}</div>`;
   if(d.rev&&!d.ok)h+=`<div class="fb h">${x.p.map(r=>r[0]+' ← '+r[1]).join('<br>')}</div>`;
   if(d.ok)h+=`<div class="fb g"><b>${d.pm}</b> (+${d.p})<br>${x.f}</div>`;
   h+=`<div class=nav>${pv}<button class=pr onclick=Gs(1) ${d.ok?'':'disabled'}>${x.s=='f'?'ابدأ التحدي النهائي 🔥':'التالي ←'}</button></div></div>`;
  }else{
   const ca=x.a||0;if(!d.o)d.o=x.ns?x.o.map((_,k)=>k):sh(x.o.map((_,k)=>k));
   h+=`<div class=card>${tag}${x.i?'<ul>'+x.i.map(t=>'<li>'+t+'</li>').join('')+'</ul>':''}<h2>${x.q}</h2>`;
   d.o.forEach(k=>{let c='';if(d.ok&&k==ca)c='g';else if(d.sel==k)c=d.bad?'b':'s';else if(d.rev&&k==ca)c='r';h+=`<button class="o ${c}" onclick=P(${k})>${x.o[k]}</button>`});
   if(!d.ok)h+=`<div class=nav>${d.bad?'<button class=pr onclick=Tr()>حاول مرة أخرى 🔄</button>':`<button class=pr onclick=Ck() ${d.sel==null?'disabled':''}>تحقق ✔</button>`}<button onclick=Hn()>معلومة 💡</button></div>`;
   if(d.hint&&!d.ok)h+=`<div class="fb h">💡 ${x.h||DH}</div>`;
   if(d.bad)h+='<div class="fb b">✗ الإجابة غير صحيحة. راجع المعلومات ثم حاول مرة أخرى 🔄</div>';
   if(d.ok)h+=`<div class="fb g"><b>${d.pm}</b> (+${d.p})<br>${x.f}${x.g!=null&&x.pt==1?`<br>📘 ${N(x.g+1)}: ${G[x.g].nm} • المستوى الخارجي: ${G[x.g].e}`:''}</div>`;
   h+=`<div class=nav>${pv}<button class=pr onclick=Gs(1) ${d.ok?'':'disabled'}>التالي ←</button></div></div>`;
  }
  h+='<div class=tl><button onclick=Hm()>🏠 الرئيسية</button><button onclick=RS()>🔄 إعادة المرحلة</button><button onclick=TMo(1)>👨‍🏫 وضع المعلم</button></div>';
 }
 if(S.tm)h+=`<div class=ov><div class=card style="max-width:640px;width:100%"><h2>👨‍🏫 وضع المعلم</h2><p>انتقل مباشرة إلى مجموعة:</p><div class=g4>${G.map((_,g)=>`<button onclick=TG(${g})>${g+1}</button>`).join('')}</div><div class=nav><button onclick=TR()>👁️ إظهار الإجابة الصحيحة</button><button onclick=TP()>0️⃣ إعادة ضبط النقاط</button><button onclick=RG()>🔁 إعادة اللعبة</button><button class=pr onclick=TMo(0)>إغلاق</button></div></div></div>`;
 $('a').innerHTML=L(h);
}
function Go(){S.i=S.last;R()}
function Hm(){S.last=Math.max(S.i,0);S.i=-1;S.tm=0;R()}
function Gs(n){S.i=Math.max(0,Math.min(scr.length-1,S.i+n));S.last=S.i;R();scrollTo(0,0)}
function Ka(){const d=cd();d.a=1;d.p=5;S.pts+=5;R()}
function Nx(){const d=cd();if(!d.b){d.b=1;d.p+=10;S.pts+=10}Gs(1)}
function P(k){const d=cd();if(d.ok||d.bad)return;d.sel=k;R()}
function Ck(){const x=cx(),d=cd();if(d.sel==(x.a||0)){d.ok=1;d.c=1;d.pm=sh(PR)[0];d.p=d.t?5:10;S.pts+=d.p;S.ok++}else{d.bad=1;d.t=1}R()}
function Tr(){const d=cd();d.bad=0;d.sel=null;R()}
function Hn(){const d=cd();d.hint=!d.hint;R()}
function ML(k){const d=cd();d.l=k;d.msg='';R()}
function MR(k){const x=cx(),d=cd();
 if(d.l==null)d.msg='اختر أولاً مجموعة أو عنصراً من العمود الأول ثم ما يرتبط به.';
 else if(d.l==k){d.m[k]=1;d.l=null;d.msg='✓ مطابقة صحيحة';if(d.m.filter(Boolean).length==x.p.length){d.ok=1;d.c=1;d.pm=sh(PR)[0];d.p=d.e?5:10;S.pts+=d.p;S.ok++}}
 else{d.e++;d.l=null;d.msg='✗ غير صحيح، حاول مرة أخرى 🔄'}R()}
function RS(){const s=cx().s;let f=null;scr.forEach((y,k)=>{if(y.s==s){const d=S.d[k];if(d){S.pts-=d.p||0;if(d.c)S.ok--;delete S.d[k]}if(f==null)f=k}});S.i=f;S.last=f;R();scrollTo(0,0)}
function TMo(v){S.tm=v;R()}
function TG(g){S.i=scr.findIndex(y=>y.g===g);S.last=S.i;S.tm=0;R();scrollTo(0,0)}
function TP(){S.pts=0;S.ok=0;for(const k in S.d){S.d[k].p=0;S.d[k].c=0}S.tm=0;R()}
function RG(){S.i=-1;S.last=0;S.pts=0;S.ok=0;S.d={};S.tm=0;R();scrollTo(0,0)}
function TR(){if(S.i>=0)cd().rev=1;S.tm=0;R()}
R();
</script></body></html>
